name: Public release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test the release gate
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m unittest
          tests.test_public_release_audit
          tests.test_public_workflow_contract
          tests.test_eve_bootstrap
          tests.test_dependency_license_audit
          tests.test_public_portability
      - name: Verify direct dependency licenses
        run: python bin/eve_dependency_license_audit.py --json
      - name: Audit the public tree
        run: python bin/eve_public_release_audit.py --root . --full
      - name: Prove the exported artifact matches its reviewed manifest
        run: |
          python bin/eve_public_release_audit.py \
            --root . \
            --write-manifest "${RUNNER_TEMP}/eve-public-manifest.json" \
            --export "${RUNNER_TEMP}/eve-public-export" \
            --full
          python bin/eve_public_release_audit.py \
            --root "${RUNNER_TEMP}/eve-public-export" \
            --verify-manifest "${RUNNER_TEMP}/eve-public-manifest.json" \
            --exact-tree \
            --full

  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install the locked core runtime dependency
        run: python -m pip install --disable-pip-version-check "py-trees==2.4.0"
      - name: Run portable runtime contracts
        run: >-
          python -m unittest
          tests.test_bootstrap_install
          tests.test_agui
          tests.test_chat_protocol
          tests.test_chat_followups
          tests.test_store
          tests.test_repository
          tests.test_database_lifecycle
          tests.test_tracing_contracts
          tests.test_performance
          tests.test_attachments
          tests.test_install_artifacts
          tests.test_monitor_projection
          tests.test_runtime_projection
          tests.test_sensory_sessions
          tests.test_http_body
          tests.test_http_headers
          tests.test_http_json
          tests.test_http_path
          tests.test_http_query
          tests.test_http_server
          tests.test_http_security
          tests.test_openai_compat
          tests.test_runtime_api
          tests.test_capability_intelligence
          tests.test_capability_lifecycle_truth
          tests.test_model_topology
          tests.test_openclaw_status
          tests.test_openclaw_validation_environment
          tests.test_platform_runtime
          tests.test_specialist_substrates

  macos-native-contracts:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install the pinned test runner
        run: python -m pip install --disable-pip-version-check "pytest==9.0.3"
      - name: Typecheck native bridges and verify the canonical Mac product contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/test_eve_app_server.py
          tests/test_canonical_eve_app.py
          tests/test_macos_native_capabilities.py

  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan Git history with redaction
        run: /tmp/gitleaks git --redact --no-banner --verbose .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
