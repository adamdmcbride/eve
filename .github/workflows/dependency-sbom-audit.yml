name: Transitive dependency license gate

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eve-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-current-default-branch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Export the current GitHub dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 90 --max-filesize 26214400 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
            --output /tmp/eve-public-sbom.json
      - name: Verify licenses and exact locked Python inventory
        run: >-
          python bin/eve_dependency_license_audit.py
          --root .
          --sbom /tmp/eve-public-sbom.json
          --source-revision "${GITHUB_SHA}"
          --json
