name: Bug report
description: Report a reproducible problem without private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private conversations, personal data, raw model prompts, or unredacted logs. Use the Security tab for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible behavior and why it is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Eve revision or release
      placeholder: Commit SHA or version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS version, hardware, Python version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include only bounded, non-sensitive output needed to establish the failure.

