<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Eve</title>
    <link rel="stylesheet" href="/styles.css?v=11" />
  </head>
  <body data-daypart="night" data-eve-state="connecting">
    <div class="eve-field" aria-hidden="true">
      <span class="eve-field-light eve-field-light--cool"></span>
      <span class="eve-field-light eve-field-light--warm"></span>
      <span class="eve-field-current"></span>
    </div>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Past conversations">
        <div class="sidebar-head">
          <button class="identity" id="show-live" type="button" aria-label="Return to Eve right now">
            <span class="identity-copy"><strong>Eve</strong><small id="identity-place">Here, inside this Mac</small></span>
            <span class="live-badge" id="identity-badge" hidden></span>
          </button>
          <button class="icon-button" id="new-chat" type="button" title="Start a fresh focus" aria-label="Start a fresh focus">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <nav class="conversation-list" id="conversation-list" aria-label="Past focused conversations"></nav>
      </aside>

      <main class="workspace" id="workspace">
        <header class="conversation-head">
          <button class="icon-button sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Show past conversations" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" /></svg>
          </button>
          <div class="conversation-title-wrap">
            <div class="conversation-copy">
              <h1 id="conversation-title">Eve</h1>
              <span class="conversation-presence" role="status" aria-live="polite">
                <i class="status-dot" id="status-dot" aria-hidden="true"></i>
                <span id="status-label">Connecting</span>
                <span class="presence-detail" id="conversation-state" hidden></span>
              </span>
            </div>
          </div>
          <button class="icon-button" id="speak-toggle" type="button" title="Let Eve speak" aria-label="Let Eve speak" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5ZM15 9.5c1.3 1.4 1.3 3.6 0 5M18 7c2.8 2.8 2.8 7.2 0 10" /></svg>
          </button>
          <button class="icon-button" id="senses-toggle" type="button" title="Let Eve perceive" aria-label="Configure Eve's sensory session" aria-expanded="false" aria-controls="senses-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="2.6" /></svg>
          </button>
        </header>

        <section class="senses-panel" id="senses-panel" aria-labelledby="senses-title" hidden>
          <div class="senses-panel-head">
            <span><strong id="senses-title">Perceive with Eve</strong><small>Explicit, time-bounded, local feature sensing</small></span>
            <button type="button" id="senses-close" aria-label="Close sensory controls">Close</button>
          </div>
          <p>Only compact numeric and categorical features leave this window. Eve does not retain recordings, frames, transcripts, screen content, or keystrokes.</p>
          <div class="senses-options">
            <label><input id="sense-audio" type="checkbox" checked /> <span><strong>Sound patterns</strong><small>Energy, likely speech activity, and acoustic change</small></span></label>
            <label><input id="sense-visual" type="checkbox" checked /> <span><strong>Visual scene</strong><small>Light, motion, scene change, and optional local face count</small></span></label>
            <label><input id="sense-touch" type="checkbox" checked /> <span><strong>Interaction feedback</strong><small>Aggregate pointer, key-count, focus, and visibility signals only</small></span></label>
          </div>
          <div class="senses-actions">
            <label>Duration
              <select id="sense-duration">
                <option value="600">10 minutes</option>
                <option value="1800">30 minutes</option>
                <option value="3600">60 minutes</option>
              </select>
            </label>
            <button class="senses-start" id="senses-start" type="button">Start sensory session</button>
            <button class="senses-stop" id="senses-stop" type="button" hidden>Stop</button>
          </div>
          <span class="senses-status" id="senses-status" role="status" aria-live="polite">Off by default.</span>
        </section>

        <section class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Eve's life and your conversation"></section>

        <button class="jump-latest" id="jump-latest" type="button" hidden>
          <span>Come back to now</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
        </button>

        <div class="composer-region">
          <div class="reply-context" id="reply-context" hidden>
            <span><strong>Replying to Eve</strong><small id="reply-subject"></small></span>
            <button id="cancel-reply" type="button" aria-label="Cancel reply">Cancel</button>
          </div>
          <form class="composer" id="composer">
            <button class="composer-button" id="mic-button" type="button" title="Speak to Eve" aria-label="Speak to Eve">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3ZM5.5 11.5v.5a6.5 6.5 0 0 0 13 0v-.5M12 18.5V22M8.5 22h7" /></svg>
            </button>
            <textarea id="prompt" rows="1" maxlength="8000" placeholder="Talk to me" aria-label="Message Eve" autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="Send message">
              <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14" /></svg>
              <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
            </button>
          </form>
        </div>
      </main>
    </div>

    <script src="/app.js?v=11" defer></script>
  </body>
</html>
